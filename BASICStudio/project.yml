name: BASICStudio
options:
  bundleIdPrefix: com.aibasic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BASICCore:
    path: ../BASICCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    branch: main
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  BASICStudio:
    type: application
    platform: macOS
    sources:
      - path: Sources/BASICStudio
        excludes:
          - Resources
    resources:
      - path: Sources/BASICStudio/Resources/Demos/studio
    dependencies:
      - package: BASICCore
        product: BASICCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibasic.BASICStudio
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: AIBasic Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  BASICStudio:
    build:
      targets:
        BASICStudio: all
    run:
      config: Debug
    test:
      config: Debug
